<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">
            Leila Estes
        </a>
        <nav>
            <a href="about.html">About</a>
            <a href="work.html">Work</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="contact-page">
            <div class="contact-heading">
                <p class="small-title"></p>
                <h1>Send a <br>Message:</h1>
                <p>
                </p>
            </div>
            <div class="contact-form">
                <form action="https://docs.google.com/forms/d/e/1FAIpQLSeA6tfyy7iO0ZbMUqt1sr4FnS1AwuExxtBgBOK4ESKaHIZyFg/formResponse"
                    method="POST"
                    target="_blank">
                    <label for="name">Name<span class="required">*required</span></label>
                    <input type="text" id="name" name="entry.1319702691" required>
                    <label for="email">Email<span class="required">*required</span></label>
                    <input type="email" id="email" name="entry.1056605875" required>
                    <label for="subject">Subject<span class="required">*required</span></label>
                    <input type="text" id="subject" name="entry.2094719429" required>
                    <label for="message">Message<span class="required">*required</span></label>
                    <textarea id="message" name="entry.504958139" required></textarea>
                    <button type="submit" class="button">
                        Send Message
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
